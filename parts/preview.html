<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Walmart DC — model library preview</title>
<style>
  html,body{margin:0;height:100%;background:#eef2f7;overflow:hidden;font-family:"Noto Sans","DejaVu Sans",sans-serif}
  #labels{position:absolute;inset:0;pointer-events:none}
  .lbl{position:absolute;transform:translate(-50%,-100%);text-align:center;line-height:1.15;background:#041E42;color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:8px;white-space:nowrap;box-shadow:0 1px 3px #0003}
  .lbl:after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-top-color:#041E42;border-bottom:0}
  .lbl b{color:#FFC220;font-weight:600;font-size:9px}
  #title{position:absolute;left:14px;top:10px;color:#041E42;font-weight:700;font-size:15px}
  #title span{color:#0071CE} #title small{color:#5a6372;font-weight:500;font-size:11px;margin-left:8px}
</style>
<!-- REQUIRED import map: models.js and the three/addons it pulls in must resolve to ONE three instance. -->
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head><body>
<div id="title">Walmart DC <span>model library</span><small>real-world scale · 1 unit = 1 m · grid 1 m</small></div>
<div id="labels"></div>
<script type="module">
window.__errors = []; window.addEventListener('error', (e) => window.__errors.push(String(e.message)));
import * as THREE from 'three';
import { MODELS, SIZES } from './models.js';

const q = new URLSearchParams(location.search);
const only = q.get('only'), rotOn = q.get('rot') !== '0', manual = q.get('manual') === '1', showLabels = q.get('labels') !== '0';
const angle0 = THREE.MathUtils.degToRad(+(q.get('angle') ?? 35)), elev = +(q.get('elev') ?? 0.5), zoom = +(q.get('zoom') ?? 1);

// preview-only demo states (models are created with these options; behaviour lives in models.js)
const demo = {
  semiTruck: { speed: 3 }, yardTractor: { speed: 2 }, forklift: { autoLift: true, load: true }, autoStacker: { autoLift: true, load: true },
  worker: { walking: true }, workerBlue: { walking: true }, conveyor: { length: 4, totes: 3 }, riderPalletTruck: { speed: 1 },
  walkieStacker: { autoLift: true }, amr: { speed: 0.6 },
};
const SKIP = new Set(['pallet']); // generic entry duplicated by the variant entries
const list = only ? only.split(',') : Object.keys(MODELS).filter((n) => !SKIP.has(n));
const STATIC = new Set(['facade']); // too big to spin: shown front-on

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xeef2f7); scene.fog = new THREE.Fog(0xeef2f7, 120, 260);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb9c4d2, 1.35));
const sun = new THREE.DirectionalLight(0xffffff, 2.1); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.radius = 4; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({ color: 0xe3e8ef, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(200, 200, 0xd3dae3, 0xd8dee6); grid.position.y = 0.002; scene.add(grid);

// --- build + measure (true scale, no normalisation)
const items = [];
for (const n of list) {
  const f = MODELS[n]; if (!f) { window.__errors.push('unknown model ' + n); continue; }
  let m; try { m = f(demo[n] || {}); } catch (e) { window.__errors.push(n + ': ' + e.message); console.error(n, e); continue; }
  m.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(m), size = box.getSize(new THREE.Vector3());
  const holder = new THREE.Group(), spin = new THREE.Group(); holder.add(spin); spin.add(m);
  m.position.set(-(box.min.x + box.max.x) / 2, 0, -(box.min.z + box.max.z) / 2); // centre on turntable (origin stays at model ground)
  const isStatic = STATIC.has(n) || only;
  const R = isStatic ? 0 : Math.hypot(size.x, size.z) / 2 + 0.15; // turntable radius = swept radius
  items.push({ n, m, holder, spin, size, R, isStatic, foot: isStatic ? Math.max(size.x, 1) : Math.max(2 * R, 2.5), depth: isStatic ? size.z : 2 * R });
}
// --- shelf-pack rows, biggest at the back (far from camera)
const ROW_W = 40, GAP = 0.6; const rowsArr = []; let cur = null;
[...items].sort((a, b) => b.foot - a.foot).forEach((it) => { if (!cur || cur.w + it.foot + GAP > ROW_W) { cur = { items: [], w: 0, d: 0 }; rowsArr.push(cur); }
  cur.items.push(it); cur.w += it.foot + GAP; cur.d = Math.max(cur.d, it.depth); });
let z = 0; const tableMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 });
for (const row of rowsArr) { let x = -row.w / 2 + GAP / 2; z += row.d / 2;
  for (const it of row.items) { it.holder.position.set(x + it.foot / 2, 0, z - (rowsArr.length ? 0 : 0)); x += it.foot + GAP;
    if (!only && !it.isStatic) { const t = new THREE.Mesh(new THREE.CylinderGeometry(it.R, it.R + 0.03, 0.03, 64), tableMat); t.position.y = 0.015; t.receiveShadow = true; it.holder.add(t); it.spin.position.y = 0.03; }
    scene.add(it.holder); }
  z += row.d / 2 + GAP; }
// rows were laid from z=0 forward (+z = toward camera); biggest row first → furthest. Centre everything.
const all = new THREE.Box3(); items.forEach((it) => all.expandByObject(it.holder)); const ctr = all.getCenter(new THREE.Vector3());
items.forEach((it) => { it.holder.position.x -= ctr.x; it.holder.position.z -= ctr.z; it.spin.rotation.y = it.isStatic ? 0 : 0.6; });
// labels: anchored to each model's own bbox top-centre
const labelsEl = document.getElementById('labels');
for (const it of items) { if (only || !showLabels) break; const el = document.createElement('div'); el.className = 'lbl';
  el.innerHTML = `${it.n.replace(/([A-Z])/g, ' $1').toLowerCase()}<br><b>${it.size.x.toFixed(1)}×${it.size.y.toFixed(1)}×${it.size.z.toFixed(1)} m</b>`; labelsEl.append(el); it.el = el; }

const camera = new THREE.PerspectiveCamera(only ? 35 : 32, innerWidth / innerHeight, 0.05, 800);
function frameCam() {
  const box = new THREE.Box3(); items.forEach((it) => box.expandByObject(it.holder));
  const c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
  const fit = only ? Math.max(Math.hypot(sz.x, sz.z) / camera.aspect * 1.1, sz.y * 1.15 + Math.hypot(sz.x, sz.z) * 0.3) : Math.max(sz.x / camera.aspect * 1.0, sz.z * 0.9);
  const R = fit / 2 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / zoom * (only ? 1 : 1.0);
  const a = only ? angle0 : 0, e = only ? elev : 0.72;
  camera.position.set(c.x + Math.sin(a) * Math.cos(e) * R, (only ? c.y : 0) + Math.sin(e) * R, c.z + Math.cos(a) * Math.cos(e) * R);
  camera.lookAt(c.x, only ? c.y : 0, c.z + (only ? 0 : sz.z * 0.06));
  const ext = Math.max(sz.x, sz.z) * 0.62 + 3; sun.position.set(c.x + ext * 0.5, ext * 1.3, c.z + ext * 0.75); sun.target.position.copy(c);
  Object.assign(sun.shadow.camera, { left: -ext, right: ext, top: ext, bottom: -ext, near: 0.5, far: ext * 4 }); sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.mapSize.set(only ? 2048 : 4096, only ? 2048 : 4096);
}
frameCam();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); frameCam(); });

let T = 0; const v = new THREE.Vector3();
function step(dt, render = true) {
  T += dt;
  for (const it of items) {
    if (rotOn && !it.isStatic) it.spin.rotation.y += dt * 0.35;
    const ud = it.m.userData;
    if (ud.setOpen && it.n === 'dockDoor') ud.setOpen(Math.sin(T * 0.6) > -0.3 ? 1 : 0);
    ud.update?.(dt, T);
    if (it.el) { v.set(it.holder.position.x, it.size.y + 0.25 + (it.isStatic ? 0 : 0.03), it.holder.position.z).project(camera);
      it.el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; it.el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px'; }
  }
  if (render) renderer.render(scene, camera);
}
window.__step = (dt = 1 / 30, n = 1) => { for (let i = 0; i < n; i++) step(dt, i === n - 1); };
window.__names = items.map((i) => i.n); window.__sizes = Object.fromEntries(items.map((i) => [i.n, i.size.toArray().map((x) => +x.toFixed(2))]));
if (!manual) { let last = performance.now(); renderer.setAnimationLoop((now) => { const dt = Math.min(0.05, (now - last) / 1000); last = now; step(dt); }); }
else step(0.001);
window.__ready = true;
</script></body></html>
