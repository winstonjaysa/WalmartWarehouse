<!doctype html><html><head><meta charset="utf-8"><title>sorter test</title><style>html,body{margin:0;background:#dfe6ee;overflow:hidden}#out{position:absolute;left:8px;top:8px;font:12px monospace;color:#041E42;white-space:pre-wrap;max-width:1500px}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/jsm/"}}</script></head><body><pre id="out"></pre>
<script type="module">
// Headless test for sorter.js. ?shot=<simSeconds> renders a mid-flow frame without checks; default runs full checks.
import * as THREE from 'three';
import * as Sorter from './sorter.js';
import { runTest } from './sorter_test_core.js';
const qs = new URLSearchParams(location.search), shotAt = qs.has('shot') ? +qs.get('shot') : null;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xdfe6ee);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(140, 90), new THREE.MeshStandardMaterial({ color: 0xc9cfd6, roughness: 0.95 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const R = runTest(THREE, Sorter, scene, { check: shotAt === null, shotAt, log: (...a) => console.log(a.join(' ')), colors: [0xc0915a, 0xb4834e, 0xd2a46c, 0xa9774a] });
const srt = R.srt; delete R.srt;
R.facadeIsLast = Sorter.getInstance() === srt;
R.laneEnds = srt.laneNames.map((n, k) => [n, ...srt.getLaneEndWorld(k).toArray().map((x) => +x.toFixed(2))]);
R.inductStarts = [0, 1, 2].map((k) => srt.getInductStartWorld(k).toArray().map((x) => +x.toFixed(2)));
const bb = new THREE.Box3().setFromObject(srt.group); R.bbox = [bb.min.toArray().map((x) => +x.toFixed(2)), bb.max.toArray().map((x) => +x.toFixed(2))];
R.loopLen = +srt.loop.len.toFixed(2);
const ren = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); ren.setSize(1600, 900); ren.shadowMap.enabled = true; ren.shadowMap.type = THREE.PCFSoftShadowMap; document.body.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa4b0, 1.3)); const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(15, 40, 25); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, far: 120 }); scene.add(sun);
const cam = new THREE.PerspectiveCamera(40, 16 / 9, 0.1, 300); const cv = (qs.get('cam') || '16,20,30,-2,2,-4').split(',').map(Number); cam.position.set(cv[0], cv[1], cv[2]); cam.lookAt(cv[3], cv[4], cv[5]);
ren.render(scene, cam); R.drawCalls = ren.info.render.calls; R.triangles = ren.info.render.triangles;
R.pass = shotAt === null ? (R.maxPen <= 0.01 && R.overlaps === 0 && R.arrived === 40 && R.wrong === 0) : null;
window.RESULT = R; document.title = 'RESULT ' + (R.pass === null ? 'shot' : R.pass ? 'PASS' : 'FAIL');
if (qs.has('hud')) document.getElementById('out').textContent = JSON.stringify(R);
</script></body></html>
