<script type="module">
import * as THREE from 'three';

      ray.set(v.clone().addScaledVector(THREE.Object3D.DEFAULT_UP, off), dn); ray.far = off + 0.3;

  return { c: new THREE.Vector3(e[12], e[13], e[14]), a: [new THREE.Vector3(e[0], e[1], e[2]).normalize(), new THREE.Vector3(e[4], e[5], e[6]).normalize(), new THREE.Vector3(e[8], e[9], e[10]).normalize()], h: [L / 2, H / 2, W / 2] }; }

  for (let i = 0; i < live.length; i++) for (let j = i + 1; j < live.length; j++) { const o = sat(live[i], live[j]); if (o > 0.001) { R.overlaps++; R.worstOverlap = Math.max(R.worstOverlap, o); } } }

const tEnd = SHOT ?? 900;
