<!doctype html><html><head><meta charset="utf-8"><title>postfx test</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e9eef4}canvas{display:block;width:100vw;height:100vh}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body><canvas id="gl"></canvas>
<script type="module">
// ?mode=before -> the current app recipe (hemi 1.25 + amb 0.25 + sun 2.3 + fill 0.45, ACES 1.05, forward render, 250x200 m shadow)
// ?mode=after&q=high|med|low -> postfx.applyLighting + create() + markBrandDecals
import * as THREE from 'three';
import { createSemiTruck, createForklift, createWorker, createPallet } from '../models.js';
import { create, applyLighting, markBrandDecals, pickQuality, glInfo } from './postfx.js';
const QS = new URLSearchParams(location.search), MODE = QS.get('mode') || 'after';
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: MODE === 'before', preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight, false);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xe9eef4); scene.fog = new THREE.Fog(0xe9eef4, 380, 900);
const camera = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 1, 3000);
camera.position.set(16, 6.5, 13); camera.lookAt(0, 2.0, -0.5);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0xc9ced6, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const truck = createSemiTruck(); truck.rotation.y = 0; truck.position.set(-1.5, 0, -6); scene.add(truck);
const fl = createForklift(); fl.position.set(4.2, 0, 3.2); fl.rotation.y = -0.9; scene.add(fl);
const w1 = createWorker(); w1.position.set(6.5, 0, 6.2); w1.rotation.y = 0.6; scene.add(w1);
const w2 = createWorker({ vest: 'blue' }); w2.position.set(2.2, 0, 6.8); w2.rotation.y = 2.4; scene.add(w2);
for (let i = 0; i < 4; i++) { const p = createPallet(); p.position.set(6 + (i % 2) * 1.3, 0, -0.5 + Math.floor(i / 2) * 1.5); scene.add(p); }
// brand swatch card (#0071CE | #FFC220 | #041E42), authored like models.js decals (lit MeshStandard, toneMapped:false)
const sc = document.createElement('canvas'); sc.width = 384; sc.height = 128; const cx = sc.getContext('2d');
['#0071CE', '#FFC220', '#041E42'].forEach((c, i) => { cx.fillStyle = c; cx.fillRect(i * 128, 0, 128, 128); });
const stex = new THREE.CanvasTexture(sc); stex.colorSpace = THREE.SRGBColorSpace;
const swatch = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 0.8), new THREE.MeshStandardMaterial({ map: stex, toneMapped: false, roughness: 0.8 }));
swatch.position.set(9.5, 2.6, 4.5); swatch.lookAt(camera.position); scene.add(swatch);
scene.traverse((o) => { if (o.isMesh && o !== floor && !o.material.transparent) { o.castShadow = true; o.receiveShadow = true; } });
let fx = null, q = 'direct';
if (MODE === 'before') {
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.outputColorSpace = THREE.SRGBColorSpace;
  scene.add(new THREE.HemisphereLight(0xf4f8ff, 0xb9c3cf, 1.25), new THREE.AmbientLight(0xffffff, 0.25));
  const sun = new THREE.DirectionalLight(0xfff3e2, 2.3); sun.position.set(-70, 140, 90); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
  Object.assign(sun.shadow.camera, { left: -125, right: 125, top: 100, bottom: -100, near: 10, far: 400 }); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04; sun.shadow.radius = 4;
  scene.add(sun); const fill = new THREE.DirectionalLight(0xdfe9ff, 0.45); fill.position.set(90, 60, -80); scene.add(fill);
  // NB: parts/models.js decals are already toneMapped:false MeshStandard (lit); app materials behave the same way
} else {
  q = pickQuality(renderer);
  const rig = applyLighting(scene, renderer, { quality: q, center: [0, 0] });
  window.__texelCm = rig.texelCm;
  window.__brandHits = markBrandDecals(scene).map((m) => m.name);
  fx = create(renderer, scene, camera, { quality: q, outlineObjects: [truck, fl, w1, w2] });
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); fx ? fx.setSize(innerWidth, innerHeight) : renderer.setSize(innerWidth, innerHeight, false); });
const draw = () => (fx ? fx.render(1 / 60) : renderer.render(scene, camera));
for (let i = 0; i < 3; i++) draw();
// screen boxes of brand decals for colour sampling
function box(o) { const b = new THREE.Box3().setFromObject(o), pts = []; for (const x of [b.min.x, b.max.x]) for (const y of [b.min.y, b.max.y]) for (const z of [b.min.z, b.max.z]) { const v = new THREE.Vector3(x, y, z).project(camera); pts.push([(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight]); }
  return [Math.min(...pts.map(p => p[0])), Math.min(...pts.map(p => p[1])), Math.max(...pts.map(p => p[0])), Math.max(...pts.map(p => p[1]))].map(Math.round); }
const P = truck.userData.parts;
const t0 = performance.now(); const N = 5; for (let i = 0; i < N; i++) draw(); renderer.getContext().finish(); const ms = (performance.now() - t0) / N;
window.__info = { mode: MODE, quality: fx ? fx.quality : 'direct', gl: glInfo(renderer).name, msPerFrame: +ms.toFixed(1), pr: renderer.getPixelRatio(),
  logo: box(P.logoRight), swatch: [-0.8, 0, 0.8].map((x) => { const v = new THREE.Vector3(x, 0, 0); swatch.localToWorld(v); v.project(camera); return [Math.round((v.x + 1) / 2 * innerWidth), Math.round((1 - v.y) / 2 * innerHeight)]; }), passes: fx ? fx.composer ? fx.composer.passes.map(p => p.constructor.name) : ['direct'] : ['direct'], texelCm: window.__texelCm, brandHits: window.__brandHits };
window.__ready = true;
</script></body></html>
