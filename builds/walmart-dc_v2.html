<script>
  // Resolve theme before first paint: ?theme= > localStorage > OS preference
  (function () {
    var p = new URLSearchParams(location.search), q = p.get('theme'), s = null;
    try { s = localStorage.getItem('rdc-theme'); } catch (e) {}

<style>
/* ===== Tokens ===== */
:root {

  --focus: 0 0 0 3px rgba(0, 113, 206, .32);
  --shadow-sm: 0 1px 2px rgba(4, 30, 66, .06);
  --shadow: 0 1px 0 var(--hairline) inset, 0 1px 2px rgba(4, 30, 66, .05), 0 8px 24px -6px rgba(4, 30, 66, .12);
  --shadow-lg: 0 1px 0 var(--hairline) inset, 0 24px 48px -12px rgba(4, 30, 66, .22);
  --ok: #10915a; --ok-bg: rgba(16, 145, 90, .11);
  --warn: #c56a00; --warn-bg: rgba(255, 160, 0, .15);
  --crit: #d92d20; --crit-bg: rgba(217, 45, 32, .11);
  --info: #0071CE; --info-bg: rgba(0, 113, 206, .10);
  --muted-bg: rgba(4, 30, 66, .06);

}

  --panel: rgba(14, 22, 36, .66); --panel-solid: #0e1624; --panel-hover: rgba(22, 33, 52, .82); --panel-inset: rgba(255, 255, 255, .04);
  --border: rgba(255, 255, 255, .08); --border-strong: rgba(255, 255, 255, .16); --hairline: rgba(255, 255, 255, .06);
  --text: #e7edf6; --text-2: #a3b0c4; --text-3: #6b7a90;

  --shadow-lg: 0 1px 0 var(--hairline) inset, 0 28px 56px -12px rgba(0, 0, 0, .7);
  --ok: #3ccf8e; --ok-bg: rgba(60, 207, 142, .13);
  --warn: #ffc24a; --warn-bg: rgba(255, 194, 32, .14);

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font); font-size: 13px; line-height: 1.45; color: var(--text); background: var(--bg); overflow: hidden;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-feature-settings: "cv11", "ss01", "ss03";

}

button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: none; box-shadow: var(--focus); }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum", "cv11"; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

/* ===== Scene (Three.js mounts into #scene) ===== */
#scene { position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(1200px 700px at 55% 55%, var(--bg-grad-1), transparent 70%), linear-gradient(180deg, var(--bg-grad-1), var(--bg-grad-2)); }
#scene::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(30deg, var(--grid) 0 1px, transparent 1px 56px), repeating-linear-gradient(150deg, var(--grid) 0 1px, transparent 1px 56px);
  -webkit-mask-image: radial-gradient(ellipse 70% 65% at 55% 58%, #000 30%, transparent 80%); mask-image: radial-gradient(ellipse 70% 65% at 55% 58%, #000 30%, transparent 80%); }
.scene-placeholder { position: absolute; inset: 0; pointer-events: none; }
.scene-placeholder svg { position: absolute; left: 50%; top: 56%; width: 760px; height: auto; transform: translate(-58%, -50%); overflow: visible;
  filter: drop-shadow(0 30px 40px rgba(4,30,66,.18)); transition: transform var(--t-slow) var(--ease), opacity var(--t-med); }

.scene-placeholder .f-top { fill: var(--clay-floor); } .scene-placeholder .f-l { fill: var(--clay-floor-side); } .scene-placeholder .f-r { fill: var(--clay-wall-side); }
.scene-placeholder .w-top { fill: var(--clay-roof); } .scene-placeholder .w-l { fill: var(--clay-wall); } .scene-placeholder .w-r { fill: var(--clay-wall-side); }
.scene-placeholder .y-top { fill: var(--clay-yard); }
.scene-placeholder .ln { stroke: var(--clay-line); stroke-width: 1; fill: none; }
.scene-placeholder .door { fill: var(--navy); opacity: .55; }
[data-theme="dark"] .scene-placeholder .door { fill: #050b16; opacity: .9; }
.scene-placeholder .lamp { fill: var(--clay-glow); transition: fill var(--t-slow); }
.scene-placeholder .hl-top { fill: #2b8de0; } .scene-placeholder .hl-l { fill: var(--brand); } .scene-placeholder .hl-r { fill: #005aa6; }
.scene-placeholder .tr-top { fill: #fbfcfe; } .scene-placeholder .tr-l { fill: #e6ebf2; } .scene-placeholder .tr-r { fill: #cfd7e3; }
[data-theme="dark"] .scene-placeholder .tr-top { fill: #3a4b66; } [data-theme="dark"] .scene-placeholder .tr-l { fill: #2c3a52; } [data-theme="dark"] .scene-placeholder .tr-r { fill: #212d42; }
.scene-placeholder .sp-top { fill: var(--spark); } .scene-placeholder .sp-l { fill: #e9a900; } .scene-placeholder .sp-r { fill: #cf9600; }
.scene-placeholder .pin { animation: bob 2.4s var(--ease) infinite; }
.scene-hint { position: absolute; right: var(--s-2); bottom: 12px; font: 500 11px/1 var(--mono); color: var(--text-3); letter-spacing: .02em; opacity: .75; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

/* ===== Glass primitive ===== */
.glass { background: var(--panel); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow);
  transition: background-color var(--t-med) var(--ease), border-color var(--t-med) var(--ease), box-shadow var(--t-med) var(--ease); }
.ui { position: fixed; z-index: 10; }

/* ===== Top nav ===== */
.topnav { top: var(--s-2); left: var(--s-2); right: var(--s-2); height: 56px; display: flex; align-items: center; gap: var(--s-2); padding: 0 var(--s-1) 0 var(--s-2); }
.brand { display: flex; align-items: center; gap: 10px; padding-right: var(--s-1); text-decoration: none; color: var(--text); }
.wordmark { font-weight: 800; font-size: 20px; letter-spacing: -.035em; line-height: 1; color: var(--brand); }
[data-theme="dark"] .wordmark { color: #fff; }
.brand .spark { width: 24px; height: 24px; margin-left: -5px; }
.brand-sub { font-size: 10.5px; font-weight: 650; color: var(--text-3); letter-spacing: .07em; text-transform: uppercase; padding-left: 12px; border-left: 1px solid var(--border-strong); line-height: 1.25; }
.divider-v { width: 1px; height: 24px; background: var(--border); }
.facility { display: flex; align-items: center; gap: var(--s-1); height: 36px; padding: 0 10px 0 6px; border-radius: 10px; transition: background var(--t-fast); white-space: nowrap; }
.facility:hover { background: var(--muted-bg); }
.fac-ico { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; background: linear-gradient(135deg, var(--brand), var(--navy)); color: #fff; }
.fac-ico svg.i { width: 14px; height: 14px; }
.fac-name { font-weight: 650; letter-spacing: -.01em; }
.fac-meta { color: var(--text-3); font-size: 12px; }
.facility .chev { color: var(--text-3); }
.search { flex: 1; max-width: 440px; margin: 0 auto; position: relative; display: flex; align-items: center; }
.search svg.i { position: absolute; left: 12px; color: var(--text-3); pointer-events: none; }
.search input { width: 100%; height: 36px; padding: 0 64px 0 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-inset); outline: none; transition: border-color var(--t-fast), box-shadow var(--t-fast), background var(--t-fast); }
.search input::placeholder { color: var(--text-3); }
.search input::-webkit-search-cancel-button { display: none; }
.search input:focus { border-color: var(--brand); box-shadow: var(--focus); background: var(--panel-solid); }
.kbd { position: absolute; right: 8px; display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--border-strong); border-bottom-width: 2px; font: 600 11px/1 var(--font); color: var(--text-2); background: var(--panel-solid); transition: opacity var(--t-fast); }
.nav-right { display: flex; align-items: center; gap: var(--s-0); }
.live { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px 0 9px; border-radius: var(--r-pill); background: var(--crit-bg); color: var(--crit); font-weight: 750; font-size: 10.5px; letter-spacing: .1em; margin-right: var(--s-1); }
.live .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; position: relative; }
.live .dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: currentColor; animation: pulse 1.8s var(--ease) infinite; }
@keyframes pulse { 0% { transform: scale(1); opacity: .6; } 80%, 100% { transform: scale(3); opacity: 0; } }
.clock { font-weight: 550; color: var(--text-2); margin-right: var(--s-1); font-size: 12.5px; }
.clock small { color: var(--text-3); font-weight: 500; margin-left: 4px; font-size: 11px; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--text-2); transition: background var(--t-fast), color var(--t-fast), transform var(--t-fast); position: relative; }
.icon-btn:hover { background: var(--muted-bg); color: var(--text); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg.i { width: 18px; height: 18px; transition: transform var(--t-slow) var(--ease-spring), opacity var(--t-med); }
.icon-btn .swap { position: absolute; }
.icon-btn .swap.off { transform: rotate(-90deg) scale(.4); opacity: 0; }
.icon-btn .badge { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--crit); box-shadow: 0 0 0 2px var(--panel-solid); }
.avatar { width: 30px; height: 30px; border-radius: 50%; margin: 0 4px 0 6px; display: grid; place-items: center; font-weight: 750; font-size: 11.5px; color: var(--navy); background: linear-gradient(135deg, #ffe08a, var(--spark)); box-shadow: 0 0 0 2px var(--panel-solid), 0 0 0 3px var(--border-strong); }

/* ===== Sidebar ===== */
.sidebar { top: 88px; left: var(--s-2); bottom: 40px; width: var(--side-w); display: flex; flex-direction: column; overflow: hidden; }
.side-head { padding: var(--s-2) var(--s-2) 0; }
.side-title { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.side-title h2 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
.side-title .sub { color: var(--text-3); font-size: 12px; }
.tabs { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); padding: 3px; border-radius: 10px; background: var(--panel-inset); border: 1px solid var(--border); }
.tab { position: relative; z-index: 1; height: 30px; border-radius: 8px; font-weight: 600; font-size: 12.5px; color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: color var(--t-fast); }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); }
.tab .count { font-size: 10.5px; font-weight: 650; color: var(--text-3); background: var(--muted-bg); border-radius: var(--r-pill); padding: 1px 6px; }
.tab[aria-selected="true"] .count { color: var(--info); background: var(--info-bg); }
.tabs .ind { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3); border-radius: 8px; background: var(--panel-solid); box-shadow: var(--shadow-sm), 0 0 0 1px var(--border); transition: transform var(--t-med) var(--ease); }
[data-theme="dark"] .tabs .ind { background: rgba(255,255,255,.08); }
.filter-row { display: flex; gap: 4px; padding: 12px 0 var(--s-1); }
.chip-f { height: 24px; padding: 0 9px; border-radius: var(--r-pill); border: 1px solid var(--border); font-size: 12px; font-weight: 500; color: var(--text-2); white-space: nowrap; transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast); }
.chip-f:hover { border-color: var(--border-strong); color: var(--text); }
.chip-f[aria-pressed="true"] { background: var(--text); color: var(--panel-solid); border-color: var(--text); }
.panels { flex: 1; min-height: 0; position: relative; }
.tabpanel { position: absolute; inset: 0; overflow-y: auto; padding: 4px var(--s-2) var(--s-2); scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.tabpanel[hidden] { display: none; }
.tabpanel:not([hidden]) { animation: fadeUp var(--t-med) var(--ease); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Mission card */
.mission { display: block; width: 100%; text-align: left; padding: 12px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--panel-hover); margin-bottom: var(--s-1); transition: transform var(--t-fast) var(--ease), border-color var(--t-fast), box-shadow var(--t-fast); }
[data-theme="dark"] .mission { background: rgba(255,255,255,.03); }
.mission:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.mission.is-active { border-color: var(--brand); box-shadow: 0 0 0 3px var(--info-bg); }
.m-row { display: flex; align-items: center; gap: 12px; }
.m-ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.m-ico svg.i { width: 17px; height: 17px; }
.t-unl { background: var(--info-bg); color: var(--info); }
.t-put { background: rgba(124, 92, 255, .12); color: #7c5cff; }
[data-theme="dark"] .t-put { color: #a593ff; }
.t-rpl { background: var(--warn-bg); color: var(--warn); }
.t-pck { background: var(--ok-bg); color: var(--ok); }
.t-ldr { background: rgba(4, 30, 66, .08); color: var(--navy); }
[data-theme="dark"] .t-ldr { background: rgba(160, 190, 240, .12); color: #b9cbe8; }
.t-yrd { background: rgba(255, 194, 32, .2); color: #8a5f00; }
[data-theme="dark"] .t-yrd { color: var(--spark); }
.m-main { flex: 1; min-width: 0; }
.m-title { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.005em; }
.m-id { font: 500 11px/1.4 var(--mono); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-sub { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
.status { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 650; white-space: nowrap; flex: none; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-ok { color: var(--ok); background: var(--ok-bg); }
.s-info { color: var(--info); background: var(--info-bg); }
.s-warn { color: var(--warn); background: var(--warn-bg); }
.s-crit { color: var(--crit); background: var(--crit-bg); }
.s-mute { color: var(--text-2); background: var(--muted-bg); }
.progress { height: 6px; border-radius: 3px; background: var(--muted-bg); overflow: hidden; margin: 12px 0 10px; }
.progress > span { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--brand), #3a9bff); transition: width var(--t-slow) var(--ease); }
.progress.p-warn > span { background: linear-gradient(90deg, #f59e0b, var(--spark)); }
.progress.p-crit > span { background: linear-gradient(90deg, var(--crit), #ff8a7a); }
.progress.p-ok > span { background: linear-gradient(90deg, var(--ok), #4fd59a); }
.m-foot { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-2); }
.who { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.who b { font-weight: 550; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-av { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 8.5px; font-weight: 750; color: #fff; background: var(--brand); flex: none; }
.mini-av.eq { background: var(--muted-bg); color: var(--text-2); }
.mini-av.eq svg.i { width: 11px; height: 11px; }
.eta { display: inline-flex; align-items: center; gap: 4px; }
.eta svg.i { width: 13px; height: 13px; color: var(--text-3); }
.eta .pct { color: var(--text-3); margin-left: 8px; min-width: 30px; text-align: right; }

/* Vehicles */
.v-group { font-size: 10.5px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); margin: 12px 8px 4px; display: flex; justify-content: space-between; }
.v-group:first-child { margin-top: 4px; }
.vrow { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 9px 8px; border-radius: 10px; transition: background var(--t-fast); }
.vrow:hover { background: var(--muted-bg); }
.v-ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--panel-inset); border: 1px solid var(--border); color: var(--text-2); position: relative; }
.v-ico::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--panel-solid); background: var(--dotc, var(--ok)); }
.v-name { font: 600 12.5px/1.35 var(--mono); }
.v-sub { color: var(--text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }

/* Logs */
.log-tools { display: flex; justify-content: space-between; align-items: center; color: var(--text-3); font-size: 11.5px; padding: 4px 6px 8px; }

/* ===== KPI row ===== */

.delta { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; font-weight: 650; height: 20px; padding: 0 6px; border-radius: 6px; white-space: nowrap; }
.delta.good { color: var(--ok); background: var(--ok-bg); }
.delta.bad { color: var(--crit); background: var(--crit-bg); }
.delta.flat { color: var(--text-2); background: var(--muted-bg); }

.spark-svg { width: 68px; height: 24px; overflow: visible; flex: none; }

.spark-svg .ar { fill: url(#sparkFill); }

.spark-svg .end { fill: var(--brand); stroke: var(--panel-solid); stroke-width: 1.5; }
.kpi.bad .spark-svg .ln { stroke: var(--crit); } .kpi.bad .spark-svg .end { fill: var(--crit); } .kpi.bad .spark-svg .ar { fill: url(#sparkFillBad); }
.kpi.flash .v { color: var(--info); }

/* ===== Alerts ===== */
.alerts { top: 244px; right: var(--s-2); width: 320px; max-height: calc(100vh - 244px - 150px); display: flex; flex-direction: column; opacity: 0; visibility: hidden; transform: translateY(-8px) scale(.98); transform-origin: top right;
  transition: transform var(--t-slow) var(--ease), opacity var(--t-med) var(--ease), visibility 0s linear var(--t-slow); }
body.alerts-open .alerts { opacity: 1; visibility: visible; transform: none; transition: transform var(--t-slow) var(--ease), opacity var(--t-med) var(--ease), visibility 0s; }

/* Collapsed chips (desktop) */

.pchip { height: 36px; padding: 0 10px 0 10px; border-radius: 12px; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 12.5px; color: var(--text); white-space: nowrap; transition: border-color var(--t-fast), box-shadow var(--t-med); }
.pchip:hover { border-color: var(--border-strong); }
.pchip:focus-visible { outline: none; box-shadow: var(--focus); }
.pchip[aria-expanded="true"] { border-color: var(--brand); box-shadow: var(--shadow-sm), 0 0 0 3px var(--info-bg); }
.pchip svg.i { width: 15px; height: 15px; color: var(--text-2); }
.pchip .chev { width: 13px; height: 13px; color: var(--text-3); transition: transform var(--t-med) var(--ease); }

/* Caption */
.caption { left: calc(50% + (var(--side-w) + var(--s-2)) / 2); bottom: 100px; z-index: 12; max-width: min(460px, calc(100vw - 32px)); height: 30px; padding: 0 14px 0 12px; border-radius: var(--r-pill); display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; font-weight: 550; letter-spacing: .01em; color: var(--text); pointer-events: none; opacity: 0; transform: translate(-50%, 6px);
  transition: opacity var(--t-med) var(--ease), transform var(--t-med) var(--ease), left var(--t-slow) var(--ease), bottom var(--t-slow) var(--ease); }
.caption::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--spark); flex: none; box-shadow: 0 0 0 3px rgba(255, 194, 32, .22); }

/* Bottom sheet (mobile only) */
.sheet { display: none; }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 6px; }

.sev-counts .c { color: var(--crit); background: var(--crit-bg); } .sev-counts .w { color: var(--warn); background: var(--warn-bg); } .sev-counts .n { color: var(--info); background: var(--info-bg); }
.link { color: var(--info); font-size: 12px; font-weight: 550; } .link:hover { text-decoration: underline; }
.alert-list { overflow-y: auto; padding: 0 6px 6px; scrollbar-width: thin; }
.alert { display: grid; grid-template-columns: 3px 1fr auto; gap: 10px; padding: 8px; border-radius: 10px; align-items: start; width: 100%; text-align: left; transition: background var(--t-fast); }
.alert:hover { background: var(--muted-bg); }

.a-title { font-weight: 600; font-size: 12.5px; line-height: 1.35; }

.alert.is-new { animation: fadeUp var(--t-slow) var(--ease); }

.inspector { top: 244px; right: var(--s-2); bottom: 40px; width: var(--insp-w); display: flex; flex-direction: column; transform: translateX(calc(100% + 24px)); opacity: 0; visibility: hidden; box-shadow: var(--shadow-lg);
  transition: transform var(--t-slow) var(--ease), opacity var(--t-med) var(--ease), visibility 0s linear var(--t-slow); }

.insp-sub { color: var(--text-2); font-size: 12.5px; margin-top: 4px; }

.insp-progress { margin-bottom: var(--s-2); }
.insp-progress .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); }
.insp-progress .lbl b { color: var(--text); font-weight: 650; }
.insp-progress .progress { margin: 6px 0 0; height: 8px; border-radius: 4px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; margin: 0 0 var(--s-3); }
.kv > div { background: var(--panel-solid); padding: 8px 12px; min-width: 0; }
[data-theme="dark"] .kv > div { background: #0f1828; }
.kv dt { font-size: 11px; color: var(--text-3); font-weight: 550; margin-bottom: 1px; }
.kv dd { margin: 0; font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec-title { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); margin: 0 0 12px; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { position: relative; padding: 0 0 12px 24px; }
.timeline li::before { content: ""; position: absolute; left: 5px; top: 15px; bottom: -1px; width: 2px; background: var(--border-strong); opacity: .6; }
.timeline li:last-child::before { display: none; }
.timeline .nd { position: absolute; left: 0; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel-solid); border: 2px solid var(--border-strong); }
.timeline li.done .nd { background: var(--brand); border-color: var(--brand); }
.timeline li.done::before { background: var(--brand); opacity: .35; }
.timeline li.active .nd { border-color: var(--brand); box-shadow: 0 0 0 4px var(--info-bg); }
.timeline li.active .nd::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--brand); animation: pulse2 1.6s var(--ease) infinite; }
@keyframes pulse2 { 50% { opacity: .25; } }
.tl-t { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 12.5px; }
.timeline li.todo .tl-t { color: var(--text-3); font-weight: 500; }
.tl-t time { color: var(--text-3); font-weight: 500; font-size: 11.5px; }
.tl-d { color: var(--text-3); font-size: 11.5px; }
.insp-actions { display: flex; gap: var(--s-1); padding: 12px var(--s-2); border-top: 1px solid var(--border); }
.btn { height: 32px; padding: 0 12px; border-radius: 9px; font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--panel-solid); color: var(--text); box-shadow: var(--shadow-sm); transition: transform var(--t-fast), background var(--t-fast), border-color var(--t-fast); white-space: nowrap; }
[data-theme="dark"] .btn { background: rgba(255,255,255,.05); }
.btn:hover { border-color: var(--text-3); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 1px 0 rgba(255,255,255,.2) inset, 0 4px 12px -2px rgba(0, 113, 206, .45); flex: 1; }
.btn.primary:hover { background: var(--brand-600); }
.btn.danger { color: var(--crit); }
.btn svg.i { width: 14px; height: 14px; }

/* ===== Bottom dock ===== */
.dock { left: calc(50% + (var(--side-w) + var(--s-2)) / 2); bottom: 40px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 6px; border-radius: 14px; transition: left var(--t-slow) var(--ease), background-color var(--t-med); }
body.inspector-open .dock { left: calc(50% + (var(--side-w) - var(--insp-w)) / 2); }
.seg { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; border-radius: 10px; background: var(--panel-inset); border: 1px solid var(--border); }
.seg button { position: relative; z-index: 1; height: 30px; min-width: 44px; padding: 0 12px; border-radius: 7px; font-weight: 600; font-size: 12.5px; color: var(--text-2); transition: color var(--t-fast); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg button:hover { color: var(--text); }
.seg button[aria-checked="true"] { color: var(--text); }
.seg.brand button[aria-checked="true"] { color: #fff; }
.seg .ind { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 7px; background: var(--panel-solid); box-shadow: var(--shadow-sm), 0 0 0 1px var(--border); transition: transform var(--t-med) var(--ease-spring), width var(--t-med) var(--ease); }
[data-theme="dark"] .seg .ind { background: rgba(255,255,255,.1); }
.seg.brand .ind, [data-theme="dark"] .seg.brand .ind { background: var(--brand); box-shadow: 0 4px 12px -2px rgba(0, 113, 206, .5); }
.dock-label { font-size: 10.5px; color: var(--text-3); font-weight: 650; letter-spacing: .07em; text-transform: uppercase; }
.dock .sep { width: 1px; height: 24px; background: var(--border); }
.scalebar { display: flex; flex-direction: column; gap: 3px; padding: 0 10px 0 2px; font-size: 10.5px; color: var(--text-2); font-weight: 550; }
.scalebar .bar { width: 96px; height: 6px; border: 1.5px solid var(--text-2); border-top: 0; position: relative; transition: width var(--t-med) var(--ease); }
.scalebar .bar::after { content: ""; position: absolute; left: 50%; bottom: 0; height: 3px; border-left: 1.5px solid var(--text-2); }
.scalebar .lbls { display: flex; justify-content: space-between; width: 96px; transition: width var(--t-med) var(--ease); }

/* ===== Toasts ===== */
.toasts { right: var(--s-2); bottom: 104px; transition: right var(--t-slow) var(--ease), bottom var(--t-slow) var(--ease); display: flex; flex-direction: column; gap: var(--s-1); width: 340px; pointer-events: none; z-index: 30; }

.toast { pointer-events: auto; display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: start; padding: 12px 12px 10px; border-radius: var(--r-md); box-shadow: var(--shadow-lg); animation: toastIn var(--t-slow) var(--ease-spring); }

.t-ico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
.toast.info .t-ico { color: var(--info); background: var(--info-bg); }
.toast.success .t-ico { color: var(--ok); background: var(--ok-bg); }
.toast.warn .t-ico { color: var(--warn); background: var(--warn-bg); }
.toast.critical .t-ico { color: var(--crit); background: var(--crit-bg); }
.t-title { font-weight: 650; font-size: 12.5px; }
.t-msg { color: var(--text-2); font-size: 12.5px; margin-top: 1px; }
.toast .x { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: var(--text-3); }
.toast .x:hover { background: var(--muted-bg); color: var(--text); }
.toast .x svg.i { width: 14px; height: 14px; }
.t-bar { grid-column: 1 / -1; height: 2px; border-radius: 1px; background: var(--muted-bg); overflow: hidden; }
.t-bar i { display: block; height: 100%; background: currentColor; opacity: .55; animation: drain linear forwards; transform-origin: left; }
.toast.info .t-bar { color: var(--info); } .toast.success .t-bar { color: var(--ok); } .toast.warn .t-bar { color: var(--warn); } .toast.critical .t-bar { color: var(--crit); }
@keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

/* ===== Footer ===== */
.foot-note { position: fixed; z-index: 10; left: var(--s-2); bottom: 12px; font-size: 11px; color: var(--text-3); }
.foot-note b { font-weight: 600; color: var(--text-2); }

.no-trans, .no-trans *, .no-trans *::before, .no-trans *::after { transition: none !important; }

/* ===== Responsive / motion ===== */
@media (max-width: 1360px) { .kpi-val .v { font-size: 21px; } .spark-svg { width: 52px; } .brand-sub, .fac-meta { display: none; } }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .chipbar { top: 292px; } .alerts, .inspector { top: 340px; } .alerts { max-height: calc(100vh - 340px - 150px); } }
@media (prefers-reduced-motion: reduce) {

}

  .nav-right { margin-left: auto; }
  .wordmark { font-size: 18px; }

  .kpi { flex: 0 0 158px; scroll-snap-align: start; padding: 10px 12px 8px; }
  .kpi-val { margin: 4px 0 2px; } .kpi-val .v { font-size: 20px; } .kpi-val .tgt { display: none; }
  .spark-svg { width: 52px; }

  .dock { left: 50% !important; bottom: calc(var(--sheet-h) + 10px); gap: 6px; padding: 4px; border-radius: 12px; transition: bottom var(--t-slow) var(--ease), opacity var(--t-med); }
  .dock .dock-label, .dock .scalebar, .dock .sep-scale { display: none; }

  .dock .seg button svg.i { display: none; }
  .caption { left: 50% !important; bottom: calc(var(--sheet-h) + 58px); max-width: calc(100vw - 32px); }
  body.sheet-full .dock, body.sheet-full .caption { opacity: 0; pointer-events: none; }
  .toasts { left: 8px; right: 8px !important; width: auto; top: 176px; bottom: auto !important; }
  /* the sheet */
  .sheet { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: var(--sheet-h); flex-direction: column; border-radius: 18px 18px 0 0; border-bottom: 0; box-shadow: 0 -8px 32px -12px rgba(4, 30, 66, .28); transition: height var(--t-slow) var(--ease); padding-bottom: env(safe-area-inset-bottom); }

const FORK_LEN = 1.07; // one fork length for every mast truck (QA M1)
